# Keyless replay keeps the official-document composition intact and replaces only the model adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: document-convert
            name: '@deepseek-ai/dsh-document-convert'
          - id: timeout-policy
            name: '@deepseek-ai/dsh-tool-call-timeout-policy'
          - id: tool-official-document
            name: '@deepseek-ai/dsh-tool-official-document'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
